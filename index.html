// ── SCORING ──────────────────────────────────────────────────────────────────
function catScore(cat, ans) {
  let pos=0, tot=0;
  cat.qs.forEach(q => {
    const v = ans[q.id]; if(!v||v==="na") return;
    tot+=q.w; if(q.inverted?v==="nao":v==="sim") pos+=q.w;
  });
  return tot===0?null:(pos/tot)*100;
}
function finalScore(ans) {
  let tw=0,ws=0;
  CATS.forEach(c=>{const s=catScore(c,ans);if(s!==null){tw+=c.weight;ws+=c.weight*s;}});
  return tw===0?null:ws/tw;
}
function getDec(s){if(s===null)return null;return DECS.find(d=>s>=d.min)||DECS[3];}
function getSen(ans){
  const s=id=>ans[id]==="sim";
  if(!(s("c1")&&s("c4")&&s("d4")&&s("a2")))return null;
  const p=[s("e3")||s("e5"),s("e7"),s("e11")||s("e12"),s("e13")||s("e14"),s("r1")].filter(Boolean).length;
  const sr=[s("e5")&&s("e6"),s("e7")&&s("e8"),s("e9"),s("r2"),s("e11"),s("r5")].filter(Boolean).length;
  if(p>=3&&sr>=4)return SENLEVELS[0];if(p>=3)return SENLEVELS[1];return SENLEVELS[2];
}
function fmt(v,d=1){return v===null?"—":v.toFixed(d);}

// ── RADAR CHART ──────────────────────────────────────────────────────────────
// 5 axes, center (100,100), R=75. Starting from top (-90°), +72° each.
// Order: exp(top), com(TR), apr(BR), res(BL), dis(TL)
const RADAR_CATS = ["exp","com","apr","res","dis"];
const RADAR_NAMES = ["Experiência","Comunicação","Aprendizado","Resiliência","Disciplina"];
const R = 75, CX = 110, CY = 105;
const ANGLES = [-90,-18,54,126,198].map(d=>d*Math.PI/180);
const FULL_PTS = ANGLES.map(a=>([CX+R*Math.cos(a), CY+R*Math.sin(a)]));

function radarPts(catPctsMap, frac=1) {
  return RADAR_CATS.map((id,i)=>{
    const p = catPctsMap[id] || 0;
    const r = (p/100)*R*frac;
    return [CX+r*Math.cos(ANGLES[i]), CY+r*Math.sin(ANGLES[i])];
  });
}

function ptsToStr(pts){ return pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" "); }

const RADAR_SHORT = ["Experiência","Comunicação","Aprendizado","Resiliência","Disciplina"];

function RadarChart({catPctsMap, size=220}){
  const fracs = [0.25,0.5,0.75,1.0];
  const pts = radarPts(catPctsMap);
  const catColors = {exp:GM.orange,com:"#16a34a",apr:GM.yellow,res:"#db2777",dis:"#2563eb"};
  // ViewBox wider to avoid label clipping: 0 0 310 230
  return (
    <svg width={size} height={size*(240/310)} viewBox="-15 -12 320 240" style={{overflow:"visible"}}>
      {/* Grid */}
      {fracs.map(f=>(
        <polygon key={f} points={ptsToStr(FULL_PTS.map((pt,i)=>[CX+(pt[0]-CX)*f,CY+(pt[1]-CY)*f]))}
          fill="none" stroke={f===1?"#e2e8f0":"#f1f5f9"} strokeWidth={f===1?"1":"0.8"}/>
      ))}
      {/* Axes */}
      {FULL_PTS.map((pt,i)=>(
        <line key={i} x1={CX} y1={CY} x2={pt[0]} y2={pt[1]} stroke="#e2e8f0" strokeWidth="0.8"/>
      ))}
      {/* Score area */}
      <polygon points={ptsToStr(pts)} fill={GM.orange} fillOpacity="0.15" stroke={GM.orange} strokeWidth="2" strokeLinejoin="round"/>
      {/* Score dots */}
      {pts.map((pt,i)=>(
        <circle key={i} cx={pt[0]} cy={pt[1]} r="4" fill={catColors[RADAR_CATS[i]]} stroke="white" strokeWidth="1.5"/>
      ))}
      {/* Labels — 2 lines: name + score */}
      {FULL_PTS.map((pt,i)=>{
        const ang = ANGLES[i];
        const lx = CX+(R+26)*Math.cos(ang);
        const ly = CY+(R+26)*Math.sin(ang);
        const ta = Math.abs(Math.cos(ang))<0.15?"middle":Math.cos(ang)>0?"start":"end";
        const pct = catPctsMap[RADAR_CATS[i]];
        const isTop = i===0;
        const yName = isTop ? ly-9 : ly-3;
        const yScore = isTop ? ly+5 : ly+8;
        return (
          <g key={i}>
            <text x={lx} y={yName} textAnchor={ta} fontSize="9" fontWeight="600" fill="#374151" fontFamily="Montserrat,sans-serif">
              {RADAR_SHORT[i]}
            </text>
            <text x={lx} y={yScore} textAnchor={ta} fontSize="9.5" fontWeight="800" fill={catColors[RADAR_CATS[i]]} fontFamily="Montserrat,sans-serif">
              {pct!==null?pct.toFixed(0)+"%":"—"}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ── RADAR SVG for report (pure string) ───────────────────────────────────────
const RADAR_SHORT_ARR = ["Experiência","Comunicação","Aprendizado","Resiliência","Disciplina"];

function radarChartHTML(catPctsMap) {
  const fracs=[0.25,0.5,0.75,1.0];
  const pts=radarPts(catPctsMap);
  const catColors={exp:GM.orange,com:"#16a34a",apr:GM.yellow,res:"#db2777",dis:"#2563eb"};
  const gridLines=fracs.map(f=>{
    const gpts=FULL_PTS.map(pt=>[CX+(pt[0]-CX)*f,CY+(pt[1]-CY)*f]);
    return `<polygon points="${ptsToStr(gpts)}" fill="none" stroke="${f===1?"#e2e8f0":"#f1f5f9"}" stroke-width="${f===1?1:0.7}"/>`;
  }).join("");
  const axes=FULL_PTS.map(pt=>`<line x1="${CX}" y1="${CY}" x2="${pt[0].toFixed(1)}" y2="${pt[1].toFixed(1)}" stroke="#e2e8f0" stroke-width="0.7"/>`).join("");
  const area=`<polygon points="${ptsToStr(pts)}" fill="${GM.orange}" fill-opacity="0.15" stroke="${GM.orange}" stroke-width="2" stroke-linejoin="round"/>`;
  const dots=pts.map((pt,i)=>`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="5" fill="${catColors[RADAR_CATS[i]]}" stroke="white" stroke-width="1.5"/>`).join("");
  const labels=FULL_PTS.map((pt,i)=>{
    const ang=ANGLES[i];
    const lx=(CX+(R+26)*Math.cos(ang)).toFixed(1);
    const ly=(CY+(R+26)*Math.sin(ang)).toFixed(1);
    const ta=Math.abs(Math.cos(ang))<0.15?"middle":Math.cos(ang)>0?"start":"end";
    const pct=catPctsMap[RADAR_CATS[i]];
    const isTop=i===0;
    const yName=(parseFloat(ly)+(isTop?-9:-3)).toFixed(1);
    const yScore=(parseFloat(ly)+(isTop?5:9)).toFixed(1);
    return `<text x="${lx}" y="${yName}" text-anchor="${ta}" font-size="9" font-weight="600" fill="#374151" font-family="Montserrat,sans-serif">${RADAR_SHORT_ARR[i]}</text>
    <text x="${lx}" y="${yScore}" text-anchor="${ta}" font-size="10" font-weight="800" fill="${catColors[RADAR_CATS[i]]}" font-family="Montserrat,sans-serif">${pct!==null?pct.toFixed(0)+"%":"—"}</text>`;
  }).join("");
  return `<svg width="300" height="258" viewBox="-15 -12 320 240" overflow="visible" xmlns="http://www.w3.org/2000/svg">${gridLines}${axes}${area}${dots}${labels}</svg>`;
}

// ── API call ──────────────────────────────────────────────────────────────────
async function callAI(dados, catPcts, fs, dec, sen, best, worst) {
  const lines = CATS.map((c,i)=>`${c.name}: ${catPcts[i]!==null?catPcts[i].toFixed(1)+"%":"não avaliado"}`).join("; ");
  const r = await fetch("/api/ai", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514", max_tokens:1000,
      messages:[{role:"user",content:`Você é especialista em recrutamento de SDR da Growth Machine. Feedback profissional em português para envio ao cliente.
Candidato: ${dados.nome||"o candidato"} | Empresa: ${dados.empresa} | Perfil: ${dados.perfil||"SDR"}
Avaliação: ${lines} | Nota: ${fs!==null?fs.toFixed(1)+"%":"pendente"} | Decisão: ${dec?.label||"pendente"} | Senioridade: ${sen?.level||"não determinada"} | Destaque: ${best?.name||"N/A"} | Aprimoramento: ${worst?.name||"N/A"}
4 a 6 frases: pontos positivos da categoria com maior nota; atenção na com menor; justifique a senioridade; conclua com a decisão. Use o nome. Tom técnico e direto. SOMENTE o texto.`}]
    })
  });
  const data = await r.json();
  return data.content?.find(b=>b.type==="text")?.text || "";
}

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[{k:"nome",label:"Nome do candidato",full:true},{k:"data",label:"Data",type:"date"},{k:"empresa",label:"Empresa cliente"},{k:"perfil",label:"Perfil do SDR"},{k:"avaliador",label:"Avaliador(a)"}].map(f=>(
              <div key={f.k} style={{gridColumn:f.full?"1/-1":undefined}}>
                <label style={{display:"block",fontSize:11,color:"#6b7280",marginBottom:3,fontWeight:500}}>{f.label}</label>
                <input type={f.type||"text"} value={dados[f.k]} onChange={setD(f.k)}
                  style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid #e2e8f0",fontSize:13,color:GM.dark}}/>
              </div>
            ))}
          </div>
        </div>

        {/* Categories */}
        {CATS.map((cat,ci)=>(
          <div key={cat.id} style={{background:"white",borderRadius:12,border:"1px solid #e2e8f0",marginBottom:10,overflow:"hidden"}}>
            <button onClick={()=>tog(cat.id)}
              style={{width:"100%",padding:"13px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"none",border:"none",cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:cat.color,flexShrink:0}}/>
                <span style={{fontSize:14,fontWeight:600,color:GM.dark}}>{cat.name}</span>
                
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                {catPcts[ci]!==null&&<span style={{fontSize:13,fontWeight:600,color:catPcts[ci]>=75?"#16a34a":catPcts[ci]>=60?"#d97706":"#dc2626"}}>{catPcts[ci].toFixed(1)}%</span>}
                <span style={{color:"#9ca3af",fontSize:11}}>{openSec[cat.id]?"▲":"▼"}</span>
              </div>
            </button>
            {openSec[cat.id]&&(
              <div style={{padding:"4px 18px 16px",borderTop:"1px solid #f3f4f6"}}>
                {cat.qs.map((q,qi)=>(
                  <div key={q.id} style={{paddingTop:10,paddingBottom:10,borderBottom:qi<cat.qs.length-1?"1px solid #f9fafb":"none"}}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:0}}>
                      
                      <div style={{flex:1}}>
                        <p style={{fontSize:13,color:"#374151",lineHeight:1.45,margin:0}}>{q.txt}</p>
                        <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap"}}>
                          {q.inverted&&<span style={{fontSize:10,color:"#d97706",fontStyle:"italic"}}>Resposta positiva = Não</span>}
                          {q.tag&&<span style={{fontSize:10,color:GM.orange,fontWeight:600,background:"#FFF0E8",padding:"0 5px",borderRadius:3}}>novo critério</span>}
                        </div>
                      </div>
                    </div>
                    <AnsBtn id={q.id} inverted={q.inverted}/>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}

        {/* Feedback */}
        <div style={{background:"white",borderRadius:12,border:"1px solid #e2e8f0",padding:"16px 18px",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <h2 style={{fontSize:13,fontWeight:600,color:GM.dark,margin:0}}>Análise do avaliador</h2>
            <button onClick={genFeedback} disabled={status==="loading"}
              style={{padding:"7px 16px",borderRadius:8,border:"none",background:status==="loading"?"#e0e7ff":GM.orange,color:status==="loading"?"#6366f1":"#fff",fontSize:12,fontWeight:700,cursor:status==="loading"?"wait":"pointer"}}>
              {status==="loading"?"Gerando...":"✦ Gerar com IA"}
            </button>
          </div>
          {status==="loading"&&!fb&&(
            <div style={{padding:"12px",background:"#fff7ed",borderRadius:8,marginBottom:8,fontSize:12,color:GM.orange,fontWeight:500}}>
              ⏳ Gerando análise com IA...
            </div>
          )}
          <textarea value={fb} onChange={e=>setFb(e.target.value)}
            placeholder="Clique em '✦ Gerar com IA' ou escreva manualmente. A análise também é gerada automaticamente ao clicar em 'Gerar relatório'."
            rows={5} style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #e2e8f0",fontSize:13,color:"#374151",resize:"vertical",lineHeight:1.65}}/>
        </div>

        <button onClick={openReport} disabled={status==="loading"}
          style={{width:"100%",padding:14,borderRadius:12,border:"none",
            background:status==="loading"?"#fed7aa":GM.orange,
            color:"#fff",fontSize:14,fontWeight:700,cursor:status==="loading"?"wait":"pointer",marginBottom:24}}>
          {status==="loading"?"Gerando análise e relatório...":"Gerar relatório para o cliente"}
        </button>
      </div>

      {/* ── SCORE PANEL ──────────────────────────────────────────────────── */}
      <div style={{width:290,padding:"20px 14px",background:"white",borderLeft:"1px solid #e2e8f0",position:"sticky",top:0,height:"100vh",overflowY:"auto"}}>

        {/* Score */}
        <div style={{textAlign:"center",padding:"16px 12px",background:GM.dark,borderRadius:12,marginBottom:12}}>
          <div style={{fontSize:42,fontWeight:800,color:GM.orange,lineHeight:1}}>{fs!==null?Math.round(fs):"—"}</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginTop:3,letterSpacing:"0.5px"}}>NOTA FINAL</div>
          {dec&&<div style={{fontSize:11,color:GM.orange,marginTop:5,fontWeight:600,lineHeight:1.3}}>{dec.label}</div>}
        </div>

        {/* Seniority */}
        {sen&&<div style={{padding:"9px 11px",background:sen.bg,borderRadius:10,marginBottom:12,borderLeft:`3px solid ${sen.fg}`}}>
          <p style={{fontSize:9,color:sen.fg,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.5px",margin:0}}>Senioridade</p>
          <p style={{fontSize:13,color:sen.fg,fontWeight:700,margin:"2px 0 0"}}>SDR {sen.level}</p>
        </div>}

        {/* Radar chart */}
        <div style={{background:"#f9fafb",borderRadius:12,padding:"10px 6px 4px",marginBottom:12,border:"1px solid #e2e8f0"}}>
          <p style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.5px",margin:"0 0 4px",textAlign:"center"}}>Perfil de Competências</p>
          <div style={{display:"flex",justifyContent:"center"}}>
            <RadarChart catPctsMap={catPctsMap} size={240}/>
          </div>
        </div>

        {/* Category bars */}
        <p style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.5px",margin:"0 0 10px"}}>Por categoria</p>
        {CATS.map((c,i)=>{
          const p=catPcts[i];
          return <div key={c.id} style={{marginBottom:9}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
              <span style={{fontSize:11,color:"#6b7280",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:170}}>{c.name}</span>
              <span style={{fontSize:11,fontWeight:600,color:p===null?"#9ca3af":p>=75?"#16a34a":p>=60?"#d97706":"#dc2626"}}>{fmt(p)}</span>
            </div>
            <div style={{height:4,background:"#e2e8f0",borderRadius:3}}>
              <div style={{height:4,width:`${p||0}%`,background:c.color,borderRadius:3,transition:"width 0.3s"}}/>
            </div>
          </div>;
        })}

        {/* Highlights */}
        {(best||worst)&&<div style={{marginTop:10}}>
          {best&&<div style={{padding:"7px 10px",background:"#f0fdf4",borderRadius:8,borderLeft:"3px solid #16a34a",marginBottom:7}}>
            <p style={{fontSize:9,color:"#166534",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.5px",margin:0}}>Destaque</p>
            <p style={{fontSize:11,color:"#15803d",fontWeight:600,margin:"2px 0 0"}}>{best.name}</p>
          </div>}
          {worst&&<div style={{padding:"7px 10px",background:"#fef2f2",borderRadius:8,borderLeft:"3px solid #dc2626"}}>
            <p style={{fontSize:9,color:"#991b1b",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.5px",margin:0}}>Aprimorar</p>
            <p style={{fontSize:11,color:"#b91c1c",fontWeight:600,margin:"2px 0 0"}}>{worst.name}</p>
          </div>}
        </div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
