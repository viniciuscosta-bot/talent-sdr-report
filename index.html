<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',system-ui,sans-serif;background:#f1f5f9;}
input,textarea,button,select{font-family:inherit;}
textarea{outline:none;resize:vertical;}
input:focus,textarea:focus{outline:2px solid #F96500;outline-offset:1px;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:#f1f5f9;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
.app{display:flex;min-height:100vh;}
.form-panel{flex:1;padding:20px;overflow-y:auto;max-width:700px;}
.score-panel{width:290px;padding:20px 14px;background:white;border-left:1px solid #e2e8f0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.card{background:white;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:10px;}
.card-body{padding:16px 18px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:14px 18px;background:white;border-radius:12px;border:1px solid #e2e8f0;}
.btn{cursor:pointer;border:none;font-family:inherit;font-weight:700;}
.btn-reset{padding:7px 14px;border-radius:8px;border:1px solid #e2e8f0;background:white;font-size:12px;color:#6b7280;}
.btn-ai{padding:7px 16px;border-radius:8px;font-size:12px;color:#fff;background:#F96500;}
.btn-ai:disabled{background:#e0e7ff;color:#6366f1;cursor:wait;}
.btn-report{width:100%;padding:14px;border-radius:12px;font-size:14px;color:#fff;background:#F96500;margin-bottom:24px;}
.btn-report:disabled{background:#fed7aa;cursor:wait;}
.cat-header{width:100%;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;background:none;border:none;cursor:pointer;font-family:inherit;}
.cat-body{padding:4px 18px 16px;border-top:1px solid #f3f4f6;}
.q-row{padding:10px 0;border-bottom:1px solid #f9fafb;}
.q-row:last-child{border-bottom:none;}
.ans-btns{display:flex;gap:4px;margin-top:8px;}
.ans-btn{padding:5px 14px;font-size:12px;border:1.5px solid #d1d5db;border-radius:6px;background:transparent;color:#6b7280;cursor:pointer;font-family:inherit;transition:all 0.12s;}
.ans-btn.sel-sim{background:#16a34a;color:#fff;border-color:#16a34a;}
.ans-btn.sel-nao{background:#dc2626;color:#fff;border-color:#dc2626;}
.ans-btn.sel-na{background:#6366f1;color:#fff;border-color:#6366f1;}
.progress-bar{height:5px;background:#e2e8f0;border-radius:3px;}
.progress-fill{height:5px;background:#F96500;border-radius:3px;transition:width 0.3s;}
.score-box{text-align:center;padding:16px 12px;background:#222223;border-radius:12px;margin-bottom:12px;}
.score-num{font-size:42px;font-weight:800;color:#F96500;line-height:1;}
.bar-track{height:4px;background:#e2e8f0;border-radius:3px;}
.bar-fill{height:4px;border-radius:3px;transition:width 0.3s;}
label{display:block;font-size:11px;color:#6b7280;margin-bottom:3px;font-weight:500;}
input[type=text],input[type=date]{width:100%;padding:8px 10px;border-radius:7px;border:1px solid #e2e8f0;font-size:13px;color:#222223;font-family:inherit;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.full{grid-column:1/-1;}
.tag-novo{font-size:10px;color:#F96500;font-weight:600;background:#FFF0E8;padding:0 5px;border-radius:3px;}
.tag-inv{font-size:10px;color:#d97706;font-style:italic;}
.feedback-area{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #e2e8f0;background:#f9fafb;font-size:13px;color:#374151;line-height:1.65;white-space:pre-wrap;}
.sen-badge{padding:9px 11px;border-radius:10px;margin-bottom:12px;}
.highlight-card{padding:7px 10px;border-radius:8px;margin-bottom:7px;}
</style>
</head>

// ── SCORING ──────────────────────────────────────────────────────────────────
function catScore(cat) {
  var pos=0, tot=0;
  cat.qs.forEach(function(q) {
    var v = state.ans[q.id];
    if (!v || v==="na") return;
    tot += q.w;
    if (q.inv ? v==="nao" : v==="sim") pos += q.w;
  });
  return tot===0 ? null : (pos/tot)*100;
}

function finalScore() {
  var tw=0, ws=0;
  CATS.forEach(function(c) {
    var s = catScore(c);
    if (s!==null) { tw+=c.weight; ws+=c.weight*s; }
  });
  return tw===0 ? null : ws/tw;
}

function getDec(s) {
  if (s===null) return null;
  return DECS.find(function(d){ return s>=d.min; }) || DECS[3];
}

function getSen() {
  var a = state.ans;
  var s = function(id){ return a[id]==="sim"; };
  if (!(s("c1")&&s("c4")&&s("d4")&&s("a2"))) return null;
  var p = [s("e3")||s("e5"), s("e7"), s("e11")||s("e12"), s("e13")||s("e14"), s("r1")].filter(Boolean).length;
  var sr = [s("e5")&&s("e6"), s("e7")&&s("e8"), s("e9"), s("r2"), s("e11"), s("r5")].filter(Boolean).length;
  if (p>=3&&sr>=4) return SENLEVELS[0];
  if (p>=3) return SENLEVELS[1];
  return SENLEVELS[2];
}

function fmt(v) { return v===null ? "—" : v.toFixed(1); }

// ── RADAR CHART ──────────────────────────────────────────────────────────────
var RADAR_IDS   = ["exp","com","apr","res","dis"];
var RADAR_NAMES = ["Experiência","Comunicação","Aprendizado","Resiliência","Disciplina"];
var R=75, CX=110, CY=105;
var ANGLES = [-90,-18,54,126,198].map(function(d){ return d*Math.PI/180; });
var FULL_PTS = ANGLES.map(function(a){ return [CX+R*Math.cos(a), CY+R*Math.sin(a)]; });
var RADAR_COLORS = {exp:"#F96500",com:"#16a34a",apr:"#FF7D12",res:"#db2777",dis:"#2563eb"};

function radarPts(catPctsMap) {
  return RADAR_IDS.map(function(id,i) {
    var p = catPctsMap[id] || 0;
    var r = (p/100)*R;
    return [CX+r*Math.cos(ANGLES[i]), CY+r*Math.sin(ANGLES[i])];
  });
}

function ptsStr(pts) {
  return pts.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
}

function radarSVG(catPctsMap, size) {
  size = size || 220;
  var h = size*(240/310);
  var fracs = [0.25,0.5,0.75,1.0];
  var pts = radarPts(catPctsMap);

  var grid = fracs.map(function(f) {
    var gpts = FULL_PTS.map(function(pt){ return [CX+(pt[0]-CX)*f, CY+(pt[1]-CY)*f]; });
    return '<polygon points="'+ptsStr(gpts)+'" fill="none" stroke="'+(f===1?"#e2e8f0":"#f1f5f9")+'" stroke-width="'+(f===1?1:0.8)+'"/>';
  }).join("");

  var axes = FULL_PTS.map(function(pt) {
    return '<line x1="'+CX+'" y1="'+CY+'" x2="'+pt[0].toFixed(1)+'" y2="'+pt[1].toFixed(1)+'" stroke="#e2e8f0" stroke-width="0.8"/>';
  }).join("");

  var area = '<polygon points="'+ptsStr(pts)+'" fill="#F96500" fill-opacity="0.15" stroke="#F96500" stroke-width="2" stroke-linejoin="round"/>';

  var dots = pts.map(function(pt,i) {
    return '<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="4" fill="'+RADAR_COLORS[RADAR_IDS[i]]+'" stroke="white" stroke-width="1.5"/>';
  }).join("");

  var labels = FULL_PTS.map(function(pt,i) {
    var ang = ANGLES[i];
    var lx = (CX+(R+26)*Math.cos(ang)).toFixed(1);
    var ly = (CY+(R+26)*Math.sin(ang)).toFixed(1);
    var ta = Math.abs(Math.cos(ang))<0.15?"middle":Math.cos(ang)>0?"start":"end";
    var pct = catPctsMap[RADAR_IDS[i]];
    var isTop = i===0;
    var yName = (parseFloat(ly)+(isTop?-9:-3)).toFixed(1);
    var yScore = (parseFloat(ly)+(isTop?5:8)).toFixed(1);
    return '<text x="'+lx+'" y="'+yName+'" text-anchor="'+ta+'" font-size="9" font-weight="600" fill="#374151" font-family="Montserrat,sans-serif">'+RADAR_NAMES[i]+'</text>'+
           '<text x="'+lx+'" y="'+yScore+'" text-anchor="'+ta+'" font-size="9.5" font-weight="800" fill="'+RADAR_COLORS[RADAR_IDS[i]]+'" font-family="Montserrat,sans-serif">'+(pct!==null?pct.toFixed(0)+"%":"—")+'</text>';
  }).join("");

  return '<svg width="'+size+'" height="'+h+'" viewBox="-15 -12 320 240" style="overflow:visible">'+grid+axes+area+dots+labels+'</svg>';
}

// ── API CALL ──────────────────────────────────────────────────────────────────
async function callAI() {
  var catPcts = CATS.map(catScore);
  var fs = finalScore();
  var dec = getDec(fs);
  var sen = getSen();
  var validC = CATS.map(function(c,i){ return {name:c.name, pct:catPcts[i]}; }).filter(function(c){ return c.pct!==null; });
  var best  = validC.length ? validC.reduce(function(a,b){ return b.pct>a.pct?b:a; }) : null;
  var worst = validC.length ? validC.reduce(function(a,b){ return b.pct<a.pct?b:a; }) : null;
  var d = state.dados;

  var lines = CATS.map(function(c,i){
    return c.name+": "+(catPcts[i]!==null?catPcts[i].toFixed(1)+"%":"não avaliado");
  }).join("; ");

  var prompt = "Você é especialista em recrutamento de SDR da Growth Machine. Feedback profissional em português para envio ao cliente.\n"+
    "Candidato: "+(d.nome||"o candidato")+" | Empresa: "+d.empresa+" | Perfil: "+(d.perfil||"SDR")+"\n"+
    "Avaliação: "+lines+" | Nota: "+(fs!==null?fs.toFixed(1)+"%":"pendente")+" | Decisão: "+((dec&&dec.label)||"pendente")+" | Senioridade: "+((sen&&sen.level)||"não determinada")+" | Destaque: "+((best&&best.name)||"N/A")+" | Aprimoramento: "+((worst&&worst.name)||"N/A")+"\n"+
    "4 a 6 frases: pontos positivos da categoria com maior nota; atenção na com menor; justifique a senioridade; conclua com a decisão. Use o nome. Tom técnico e direto. SOMENTE o texto.";

  var response = await fetch("/api/ai", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1000,
      messages: [{role:"user", content:prompt}]
    })
  });

  var data = await response.json();
  var block = data.content && data.content.find(function(b){ return b.type==="text"; });
  return block ? block.text : "";
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  renderForm();
  renderScorePanel();
}

function bindEvents() {
  // Reset
  var btnReset = document.getElementById("btnReset");
  if (btnReset) btnReset.addEventListener("click", function() {
    if (!confirm("Zerar todo o preenchimento?")) return;
    state.dados = {nome:"",data:"",empresa:"",perfil:"",avaliador:""};
    state.ans = {};
    state.fb = "";
    state.status = "idle";
    render();
  });

  // Dados inputs
  document.querySelectorAll("[data-field]").forEach(function(el) {
    el.addEventListener("input", function() {
      state.dados[this.dataset.field] = this.value;
      renderScorePanel();
    });
  });

  // Category toggle
  document.querySelectorAll(".cat-header").forEach(function(el) {
    el.addEventListener("click", function() {
      var id = this.dataset.cat;
      state.openSec[id] = !state.openSec[id];
      render();
    });
  });

  // Answer buttons
  document.querySelectorAll(".ans-btn").forEach(function(el) {
    el.addEventListener("click", function() {
      state.ans[this.dataset.qid] = this.dataset.val;
      render();
    });
  });

  // AI button
  var btnAI = document.getElementById("btnAI");
  if (btnAI) btnAI.addEventListener("click", async function() {
    state.status = "loading";
    render();
    try {
      var text = await callAI();
      state.fb = text;
      state.status = "done";
    } catch(e) {
      state.status = "idle";
      state.fb = "Erro ao gerar feedback. Tente novamente.";
    }
    render();
  });

  // Report button
  var btnReport = document.getElementById("btnReport");
  if (btnReport) btnReport.addEventListener("click", async function() {
    var feedbackText = state.fb;
    if (!feedbackText.trim()) {
      state.status = "loading";
      render();
      try {
        feedbackText = await callAI();
        state.fb = feedbackText;
        state.status = "done";
      } catch(e) {
        state.status = "error";
        feedbackText = "";
      }
      render();
    }
    buildReport(feedbackText);
  });
}

    '<div style="display:flex;align-items:center;gap:14px">'+iconSm+
    '<div style="margin-left:2px"><div style="color:white;font-size:19px;font-weight:800">Growth Machine</div>'+
    '<div style="color:#F96500;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;margin-top:1px">Relatório Talent SDR</div></div></div>'+
    (dec?'<div style="background:'+dec.bg+';color:'+dec.fg+';padding:7px 18px;border-radius:99px;font-size:12px;font-weight:700">'+dec.label+'</div>':'')+
    '</div></div>'+
    '<div style="height:4px;background:linear-gradient(90deg,#F96500,#FF7D12)"></div>';

  // Candidate info
  var infoFields = [["Candidato",d.nome],["Data",d.data],["Empresa",d.empresa],["Perfil SDR",d.perfil],["Avaliador(a)",d.avaliador]];
  html += '<div style="background:white;padding:18px 40px;border-bottom:1px solid #f3f4f6">'+
    '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px">'+
    infoFields.map(function(f){ return '<div><div style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:3px">'+f[0]+'</div>'+
      '<div style="font-size:13px;font-weight:600;color:#222223">'+(f[1]||"—")+'</div></div>'; }).join("")+
    '</div></div>';

  // Score + radar
  html += '<div style="background:white;padding:28px 40px;border-bottom:1px solid #f3f4f6">'+
    '<div style="display:flex;gap:24px;align-items:flex-start">'+
    '<div style="display:flex;flex-direction:column;gap:12px;flex:1">'+
    '<div style="display:flex;gap:16px;align-items:stretch">'+
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:130px;flex-shrink:0;background:#222223;border-radius:14px;padding:20px 12px">'+
    '<div style="font-size:50px;font-weight:900;color:#F96500;line-height:1">'+(fs!==null?Math.round(fs):"—")+'</div>'+
    '<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:3px;letter-spacing:.5px">DE 100</div></div>'+
    '<div style="flex:1;display:flex;flex-direction:column;gap:10px">'+
    (dec?'<div style="padding:14px 18px;background:'+dec.bg+';border-radius:10px;border-left:4px solid '+dec.fg+';flex:1">'+
      '<div style="font-size:10px;font-weight:700;color:'+dec.fg+';text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">Decisão</div>'+
      '<div style="font-size:16px;font-weight:800;color:'+dec.fg+'">'+dec.label+'</div>'+
      '<div style="font-size:11px;color:'+dec.fg+';opacity:.85;margin-top:4px">'+dec.action+'</div></div>':'')+
    (sen?'<div style="padding:14px 18px;background:'+sen.bg+';border-radius:10px;border-left:4px solid '+sen.fg+';flex:1">'+
      '<div style="font-size:10px;font-weight:700;color:'+sen.fg+';text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">Senioridade indicada</div>'+
      '<div style="font-size:16px;font-weight:800;color:'+sen.fg+'">SDR '+sen.level+'</div>'+
      '<div style="font-size:11px;color:'+sen.fg+';opacity:.85;margin-top:4px">'+sen.desc+'</div></div>':
      '<div style="padding:14px 18px;background:#f9fafb;border-radius:10px;border-left:4px solid #d1d5db;flex:1">'+
      '<div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">Senioridade indicada</div>'+
      '<div style="font-size:13px;color:#9ca3af">Dados insuficientes para determinar nível</div></div>')+
    '</div></div></div>'+
    '<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center">'+
    '<div style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:8px;text-align:center">Perfil de Competências</div>'+
    radarHtml+'</div></div></div>';

  // Cat bars
  html += '<div style="background:white;padding:26px 40px;border-bottom:1px solid #f3f4f6">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'+
    '<div style="width:4px;height:18px;background:#F96500;border-radius:2px"></div>'+
    '<h2 style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#222223">Resultado por categoria</h2></div>'+
    catBars+'</div>';

  // Highlights
  html += '<div style="padding:22px 40px;display:grid;grid-template-columns:1fr 1fr;gap:14px;background:white;border-bottom:1px solid #f3f4f6">'+
    '<div style="padding:16px;background:#f0fdf4;border-radius:12px;border-top:3px solid #16a34a">'+
    '<div style="font-size:10px;font-weight:700;color:#166534;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Principal destaque</div>'+
    '<div style="font-size:15px;font-weight:800;color:#15803d">'+(best?best.name:"—")+'</div>'+
    (best&&best.pct!=null?'<div style="font-size:11px;color:#16a34a;margin-top:3px">'+best.pct.toFixed(1)+'% de aproveitamento</div>':'')+
    '</div>'+
    '<div style="padding:16px;background:#fef2f2;border-radius:12px;border-top:3px solid #dc2626">'+
    '<div style="font-size:10px;font-weight:700;color:#991b1b;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Ponto de aprimoramento</div>'+
    '<div style="font-size:15px;font-weight:800;color:#b91c1c">'+(worst?worst.name:"—")+'</div>'+
    (worst&&worst.pct!=null?'<div style="font-size:11px;color:#dc2626;margin-top:3px">'+worst.pct.toFixed(1)+'% de aproveitamento</div>':'')+
    '</div></div>';

  // Feedback
  if (feedbackText) {
    html += '<div style="background:white;padding:26px 40px;border-bottom:1px solid #f3f4f6">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'+
      '<div style="width:4px;height:18px;background:#F96500;border-radius:2px"></div>'+
      '<h2 style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#222223">Análise do avaliador</h2></div>'+
      '<div style="padding:18px 22px;background:#fafafa;border-radius:12px;border-left:4px solid #F96500;font-size:13px;line-height:1.85;color:#374151">'+
      feedbackText.replace(/\n/g,"<br>")+'</div></div>';
  }

  // Footer
  html += '<div style="background:#222223;padding:18px 40px;display:flex;align-items:center;gap:10px">'+
    iconSm+'<span style="color:white;font-size:12px;font-weight:600;margin-left:8px">Growth Machine</span>'+
    '<span style="color:rgba(255,255,255,.35);font-size:11px;margin-left:auto">Gerado em '+new Date().toLocaleString("pt-BR")+' · Avaliador: '+(d.avaliador||"—")+'</span></div>';

  // Detail page
  html += '<div class="pb" style="background:white">'+
    '<div style="background:#222223;padding:18px 40px;display:flex;align-items:center;gap:10px">'+iconSm+
    '<div style="margin-left:8px"><div style="color:#F96500;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px">Relatório Talent SDR</div>'+
    '<div style="color:white;font-size:13px;font-weight:700">'+(d.nome||"Candidato")+' — Detalhamento técnico</div></div></div>'+
    '<div style="height:4px;background:linear-gradient(90deg,#F96500,#FF7D12)"></div>'+
    '<div style="padding:28px 40px"><p style="font-size:11px;color:#9ca3af;margin-bottom:22px">⚠ indica questões com resposta invertida (Não = resposta positiva)</p>'+
    detailSection+'</div></div>';

  // Print button
  html += '<div class="noprint" style="background:white;padding:22px 40px;display:flex;gap:12px;justify-content:center;border-top:1px solid #f3f4f6">'+
    '<button onclick="window.print()" style="padding:12px 32px;background:#F96500;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:\'Montserrat\',sans-serif">Imprimir / Salvar como PDF</button>'+
    '<button onclick="window.close()" style="padding:12px 20px;color:#6b7280;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;cursor:pointer;background:transparent;font-family:\'Montserrat\',sans-serif">Fechar</button>'+
    '</div>';

  html += '</div></body></html>';

  try {
    var blob = new Blob([html], {type:"text/html"});
    var url = URL.createObjectURL(blob);
    var w = window.open(url, "_blank");
    if (!w) alert("Pop-up bloqueado. Permita pop-ups e tente novamente.");
  } catch(e) {
    alert("Não foi possível abrir o relatório.");
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
